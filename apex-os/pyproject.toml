[project]
name = "apex-os"
version = "0.3.0"
description = "APEX OS - Personal Operating Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "httpx>=0.27",
  "alembic>=1.13",
  "anthropic>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.setuptools.package-data]
apex = ["web/templates/*.html", "web/static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
