{% extends "base.html" %}{% set bare = True %}
{% block content %}<div class="center card"><h1>Set up APEX</h1>
<p class="muted small">Creates the single owner account. All data stays in your own database.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/setup"><label>Username</label><input name="username" required autocomplete="username">
<label>Password (min. 10 characters)</label><input name="password" type="password" minlength="10" required autocomplete="new-password">
<p><button class="primary">Create owner</button></p></form></div>{% endblock %}
